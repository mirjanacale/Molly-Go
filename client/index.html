<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOLLY Go — Go Where Joy Lives</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* --- Basic chatbot styles --- */
      .chatbot-toggle {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: linear-gradient(135deg, #f2a908 0%, #a24d23 100%);
        color: #fff;
        border: none;
        border-radius: 30px;
        padding: 12px 20px;
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        z-index: 9999;
        transition: all 0.2s ease-in-out;
      }

      .chatbot-toggle:hover {
        transform: translateY(-3px);
      }

      .chatbot-panel {
        position: fixed;
        bottom: 90px;
        right: 30px;
        width: 340px;
        height: 500px;
        background: #fff;
        border-radius: 15px;
        display: none;
        flex-direction: column;
        box-shadow: 0 4px 25px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        z-index: 9998;
      }

      .chatbot-panel.open {
        display: flex;
      }

      .chatbot-header {
        background: linear-gradient(135deg, #f2a908 0%, #a24d23 100%);
        color: white;
        font-weight: 600;
        padding: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .chatbot-messages {
        flex: 1;
        padding: 10px;
        overflow-y: auto;
        background: #fafafa;
      }

      .message {
        margin: 8px 0;
      }

      .message.user .message-content {
        background: #a24d23;
        color: white;
        padding: 8px 12px;
        border-radius: 12px 12px 0 12px;
        margin-left: auto;
        width: fit-content;
      }

      .message.assistant .message-content {
        background: #ececec;
        color: #333;
        padding: 8px 12px;
        border-radius: 12px 12px 12px 0;
        width: fit-content;
      }

      .chatbot-input {
        display: flex;
        padding: 10px;
        border-top: 1px solid #ddd;
        background: #fff;
      }

      .chatbot-input input {
        flex: 1;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #ccc;
        margin-right: 10px;
        font-size: 14px;
        outline: none;
        background: #fff;
        color: #333;
        min-height: 20px;
        box-sizing: border-box;
      }

      .chatbot-input input:focus {
        border-color: #f2a908;
        box-shadow: 0 0 0 2px rgba(242, 169, 8, 0.2);
      }

      .chatbot-input button {
        background: linear-gradient(135deg, #f2a908 0%, #a24d23 100%);
        border: none;
        color: white;
        font-weight: 600;
        border-radius: 8px;
        padding: 8px 14px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .chatbot-input button:hover {
        transform: translateY(-1px);
        box-shadow: 0 2px 8px rgba(242, 169, 8, 0.3);
      }
    </style>
  </head>

  <body>
    <!-- Chat Toggle -->
    <button
      id="mollychat-toggle"
      class="chatbot-toggle"
      onclick="toggleMollyChat()"
    >
      💬 Chat with MOLLY
    </button>

    <!-- Chat Panel -->
    <div id="mollychat-panel" class="chatbot-panel">
      <div class="chatbot-header">
        <span>💬 MOLLY Travel Buddy</span>
        <button class="chatbot-close" onclick="toggleMollyChat()">×</button>
      </div>
      <div id="mollychat-messages" class="chatbot-messages">
        <div class="message assistant">
          <div class="message-content">
            Hi there! 🌍 I'm MOLLY, your travel buddy! How can I help you today?
          </div>
        </div>
      </div>
      <div class="chatbot-input">
        <input
          type="text"
          id="chatInput"
          placeholder="Tell me your destination..."
          onkeypress="handleChatInputKeypress(event)"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="sendBtn" onclick="handleSendClick()">Send</button>
      </div>
    </div>

    <!-- Chatbot Script -->
    <script src="chatbot.js" defer></script>
  </body>
</html>
